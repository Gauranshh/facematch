[project]
name = "facematch"
version = "3.0.0"
description = "Private, self-hosted face search for your photo library"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 200
target-version = "py39"

[tool.ruff.lint]
select = ["E9", "F"]
